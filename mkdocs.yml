docs_dir: docs

site_name: Sententia
site_description: FastAPI-based search and RAG engine for local Markdown files.
site_url: https://qarium.github.io/sententia/
repo_url: https://github.com/qarium/sententia
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: docs/overrides
  logo: https://avatars.githubusercontent.com/u/262344922?s=200&v=4
  palette:
    - scheme: default
      primary: custom
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
        media: "(prefers-color-scheme: light)"
    - scheme: slate
      primary: custom
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
        media: "(prefers-color-scheme: dark)"
  features:
    - navigation.tabs
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Configuration: configuration.md
  - REST API: rest-api.md
  - MCP Tools: mcp-tools.md
  - Core Concepts:
      - Storage: storage.md
      - Indexing & Search: indexing-and-search.md
      - LLM Providers: llm-providers.md
      - RAG Pipeline: rag-pipeline.md

plugins:
  - search
